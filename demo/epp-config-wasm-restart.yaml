# EPP configuration for the wasm plugin demo (restart-based).
# The wasm-filter loads its module from OCI at startup.
# Changing the plugin requires an EPP restart.
#
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: wasm-filter
  name: demo-filter
  parameters:
    module: "wasm-registry.default.svc.cluster.local:5000/demo-filter:latest"
    plainHTTP: true
- type: load-aware-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: demo-filter
  - pluginRef: load-aware-scorer
  - pluginRef: max-score-picker
