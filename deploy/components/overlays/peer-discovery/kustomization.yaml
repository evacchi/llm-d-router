# ------------------------------------------------------------------------------
# Peer Discovery Overlay
#
# Grants the EPP ServiceAccount get/list/watch on EndpointSlices, required by
# the --enable-peer-discovery EPP flag. Kept out of the base inference-gateway
# RBAC so the permission is only present when peer discovery is used.
#
# Usage: include as a Kustomize component in scenario overlays that also pass
# --enable-peer-discovery and --epp-peer-service to the EPP:
#   components:
#   - ../../../components/overlays/peer-discovery/
# ------------------------------------------------------------------------------
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
- rbac.yaml
