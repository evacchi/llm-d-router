kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ${EPP_NAME}-peer-discovery
rules:
- apiGroups:
  - "discovery.k8s.io"
  resources:
  - "endpointslices"
  verbs:
  - "get"
  - "watch"
  - "list"
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: ${EPP_NAME}-peer-discovery-binding
subjects:
- kind: ServiceAccount
  name: ${EPP_NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${EPP_NAME}-peer-discovery
