# Minimal EPP config for initial cluster deploy.
# No tokenizer, no prefix cache, no vllm-render needed.
# setup.sh replaces this with the wasm demo config.
apiVersion: llm-d.ai/v1alpha1
kind: EndpointPickerConfig
plugins:
- type: decode-filter
- type: load-aware-scorer
- type: max-score-picker
- type: single-profile-handler
schedulingProfiles:
- name: default
  plugins:
  - pluginRef: decode-filter
  - pluginRef: load-aware-scorer
  - pluginRef: max-score-picker
